volumes:
  node_modules:

services:
  # Redis Master
  redis-master:
    image: bitnami/redis:7.4
    environment:
      - REDIS_REPLICATION_MODE=master
      - ALLOW_EMPTY_PASSWORD=yes
    ports:
      - "6379:6379"
  # Redis Replicas
  redis-replica-1:
    image: bitnami/redis:7.4
    environment:
      - REDIS_REPLICATION_MODE=slave
      - REDIS_REPLICA_IP=redis-replica-1
      - REDIS_MASTER_HOST=redis-master
      - ALLOW_EMPTY_PASSWORD=yes
    ports:
      - "6380:6379"
    depends_on:
      - redis-master
  redis-replica-2:
    image: bitnami/redis:7.4
    environment:
      - REDIS_REPLICATION_MODE=slave
      - REDIS_REPLICA_IP=redis-replica-2
      - REDIS_MASTER_HOST=redis-master
      - ALLOW_EMPTY_PASSWORD=yes
    ports:
      - "6381:6379"
    depends_on:
      - redis-master

  # Redis Sentinel nodes
  redis-sentinel:
    image: bitnami/redis-sentinel:7.4
    environment:
      - REDIS_SENTINEL_QUORUM=1
      - REDIS_SENTINEL_ANNOUNCE_IP=sentinel
      - REDIS_MASTER_HOST=redis-master
      - REDIS_MASTER_SET=redis-master
    ports:
      - "26379:26379"
    depends_on:
      - redis-master
      - redis-replica-1
      - redis-replica-2

  # BullMQ Exporter App
  app:
    image: "node:alpine"
    depends_on:
      - redis-sentinel
    volumes:
      - ".:/app"
      - "node_modules:/app/node_modules"
    working_dir: /app
    environment:
      - "EXPORTER_SENTINEL_HOSTS=redis-sentinel:26379"
      - "EXPORTER_SENTINEL_NAME=redis-master"
      - "EXPORTER_PREFIX=bull"
      - "EXPORTER_STAT_PREFIX=bull_queue_"
      - "EXPORTER_AUTODISCOVER=true"
      - "EXPORTER_QUEUES=agentic_pdf_to_html_step"
      - "WAIT_UNTIL_READY=TRUE"
    ports:
      - "9538:9538"
    command:
      - sh
      - -c
      - |
        echo "Installing dependencies..."
        yarn install
        echo "Building the project..."
        yarn build
        echo "Creating test queues..."
        node test-queues.js
        echo "Waiting for Sentinel to be fully ready..."
        sleep 5
        echo "Starting BullMQ exporter..."
        node dist/src/index.js --sentinel-hosts "redis-sentinel:26379" --sentinel-name "redis-master" --prefix "bull" --metric-prefix "bull_queue_" --autoDiscover agentic_pdf_to_html_step
